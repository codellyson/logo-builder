<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      SEO config — edit values here. The same strings power the document
      <title>, the meta description, and the Open Graph / Twitter cards.
      Replace the canonical URL and og-image path before deploying.
    -->
    <title>Builty — Make your mark</title>
    <meta
      name="description"
      content="A free, fast logo builder for indie makers and designers. Vector shapes, text, gradients, effects, and PNG/SVG export — all in your browser, no signup."
    />
    <meta
      name="keywords"
      content="logo maker, logo builder, free logo, indie logos, vector logo, browser logo tool, brand mark, designer tools"
    />
    <meta name="author" content="Builty" />
    <link rel="canonical" href="https://builty.kreativekorna.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Builty" />
    <meta property="og:title" content="Builty — Make your mark" />
    <meta
      property="og:description"
      content="A free, fast logo builder for indie makers and designers. Build a real brand mark in your browser."
    />
    <meta property="og:url" content="https://builty.kreativekorna.com/" />
    <meta property="og:image" content="https://builty.kreativekorna.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Builty — Make your mark" />
    <meta
      name="twitter:description"
      content="Free logo builder for indie makers. No signup, no AI slop, exports clean SVG and PNG."
    />
    <meta name="twitter:image" content="https://builty.kreativekorna.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
